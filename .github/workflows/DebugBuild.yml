name: DebugBuild

on:
  push:
    branches:
      - master

env:
  SOLUTION_FILE_PATH: project/CG2.sln
  CONFIGURATION: Debug

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build
        run: 
          msbuild ${{env.SOLUTION_FILE_PATH}} /p:Platform=64x,Configuration=${{env.CONFIGURATION}}
          
